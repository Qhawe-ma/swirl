<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Solana Paint NFT - Create & Mint Digital Art</title>
    <meta name="description" content="Create digital artwork and mint it as real NFTs on Solana mainnet. Professional drawing tools with blockchain integration.">
    
    <!-- Node.js polyfills for browser compatibility -->
    <script>
      if (typeof globalThis.process === 'undefined') {
        globalThis.process = {
          env: {},
          browser: true,
          version: '',
          versions: { node: '16.0.0' },
          platform: 'browser',
          argv: [],
          cwd: function() { return '/'; },
          nextTick: function(fn) { setTimeout(fn, 0); },
          title: 'browser',
          pid: 1,
          ppid: 1,
          umask: function() { return 0; },
          uptime: function() { return 0; },
          hrtime: function() { return [0, 0]; }
        };
      }
      if (typeof globalThis.global === 'undefined') {
        globalThis.global = globalThis;
      }
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
